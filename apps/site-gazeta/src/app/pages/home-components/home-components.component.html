<main>  
     @if(newsItems().length > 0) {
    <div class="carousel-desktop">
        <lib-carousel [news]="carouselItems()"></lib-carousel>
    </div>
    
    <div class="carousel-mobile">
        <lib-carousel-swipe [news]="carouselItems()"></lib-carousel-swipe>
    </div>  
    }
    <lib-news-category-grid [categories]="categories()" [news]="newsItems()"></lib-news-category-grid>
    <span class="divider"></span>
    <lib-video-player [videos]="videos()" [title]="'Vídeos em alta hoje'" ></lib-video-player>
    <lib-news-category-section [category]="categories()[0]" [news]="newsItems()"></lib-news-category-section>
    <span class="divider"></span>
    <lib-news-highligths [categories]="categories().slice(1)" [news]="newsItems()"></lib-news-highligths>
    <span class="divider"></span>
 
    <lib-news-cluster [categories]="categories()" [news]="newsItems()"></lib-news-cluster>
    <span class="divider"></span>
    <div class="more-news">
        <h2>Mais notícias</h2>
        <lib-more-news [moreNews]="newsItems()"  [slice]="3"></lib-more-news>
    </div>
</main>
