<main>
  
  <lib-carousel-manager></lib-carousel-manager>
  
  <lib-news-category-grid ></lib-news-category-grid>
  
  @if(hasTopAd()){
    <lib-ads [announcements]="topAd()!"></lib-ads>
  }
  @defer (on viewport) {
    <lib-most-viewed></lib-most-viewed>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }
  @defer (on viewport) {
    <lib-latest-news ></lib-latest-news>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }
  @defer (on viewport) {
    <lib-video-manager></lib-video-manager>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }
  @defer (on viewport) {
    <lib-news-highligths></lib-news-highligths>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }

  @defer (on viewport) {
    <lib-news-cluster ></lib-news-cluster>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }

  @defer (on viewport) {
    <lib-more-news  [slice]="3" ></lib-more-news>
  }@placeholder {
    <div class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  }
</main>
