<div class="ads-container">
  <div class="ads-card">
    @if (isEdit()) {
      <button class="back-btn" [routerLink]="['/adsList']">
        <span class="material-icons">arrow_back</span>
        Voltar
      </button>
    }
    
    <div class="ads-header">
      <h2>Gerenciar Anúncios</h2>
      <p>Crie e edite seus anúncios</p>
    </div>

    <app-ads-form 
      [adToEdit]="adToEdit()"
      (formSubmitted)="handleSubmit()"
      (formCancelled)="handleCancel()">
    </app-ads-form>
  </div>
</div>
