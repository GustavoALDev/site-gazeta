<form [formGroup]="form" (ngSubmit)="onSubmit()" class="category-form">
  <div class="form-group">
    <label for="name">Nome da Categoria</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      autocomplete="off"
      placeholder="Digite o nome da categoria"
      [class.error]="form.get('name')?.invalid && form.get('name')?.touched"
    />
    <div class="error-message" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
      Nome é obrigatório
    </div>
  </div>

  <div class="form-group">
    <label for="description">Descrição</label>
    <textarea
      id="description"
      formControlName="description"
      placeholder="Digite a descrição da categoria"
      rows="3"
      
      [class.error]="form.get('description')?.invalid && form.get('description')?.touched"
    ></textarea>
    <div class="error-message" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">
      Descrição é obrigatória
    </div>
  </div>

  <div class="form-group">
    <div class="toggle-group">
      <label class="toggle-label" for="isActive">Status da Categoria</label>
      <div class="toggle-container">
        <input 
          type="checkbox" 
          id="isActive" 
          formControlName="isActive"
          class="toggle-input"
        />
        <label for="isActive" class="toggle-switch">
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-text">
          {{ form.get('isActive')?.value ? 'Ativa' : 'Inativa' }}
        </span>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-primary" [disabled]="form.invalid">
      {{ isEditing() ? 'Atualizar' : 'Criar' }} Categoria
    </button>
    <button type="button" class="btn-secondary" (click)="onCancel()" *ngIf="isEditing()">
      Cancelar
    </button>
  </div>
</form>
