<div class="videos-container">
  <div class="videos-card">
    
    <!-- Header -->
    <div class="videos-header">
      <h2>Gerenciamento de Vídeos</h2>
      <p>Faça upload e gerencie os vídeos do seu site</p>
    </div>

    <!-- Content Wrapper -->
    <div class="videos-content-wrapper">
      
      <!-- Upload Form Section -->
      <div class="upload-form-section" [class.collapsed]="!showUploadForm()">
        <div class="section-header">
          <h3>
            <span class="material-icons">{{ videoToEdit() ? 'edit' : 'cloud_upload' }}</span>
            {{ videoToEdit() ? 'Editar Vídeo' : 'Upload de Vídeo' }}
          </h3>
          <button 
            type="button" 
            class="toggle-btn" 
            (click)="toggleUploadForm()"
            [title]="showUploadForm() ? 'Ocultar formulário' : 'Mostrar formulário'"
          >
            <span class="material-icons">{{ showUploadForm() ? 'expand_less' : 'expand_more' }}</span>
          </button>
        </div>
        
        @if (showUploadForm()) {
          <div class="form-content">
            <app-video-upload
              [videoToEdit]="videoToEdit()"
              (onSave)="handleSave($event)"
              (onCancel)="handleCancel()"
            />
          </div>
        }
      </div>

      <!-- Videos List Section -->
      <div class="videos-list-section">
        @if (isLoading()) {
          <div class="loading-state">
            <span class="material-icons spinning">refresh</span>
            <p>Carregando vídeos...</p>
          </div>
        } @else {
          <app-video-list
            [videos]="videos()"
            (onEdit)="handleEdit($event)"
            (onDelete)="handleDelete($event)"
          />
        }
      </div>

    </div>
  </div>
</div>
