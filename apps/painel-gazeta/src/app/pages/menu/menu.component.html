<div class="menu-container">
  <div class="menu-card">
    <!-- Header com título -->
    <div class="page-header">
      <h1 class="page-title">Gerenciamento de Menu</h1>
      <p class="page-subtitle">Crie e organize os itens do menu de navegação do site</p>
    </div>

    <!-- Layout: Lista à esquerda, Formulário à direita -->
    <div class="menu-layout">
      <!-- Lista de Menus (Esquerda) -->
      <div class="menu-list-section">
        @if (isLoading()) {
          <div class="loading-state">
            <span class="material-icons spinning">refresh</span>
            <p>Carregando menus...</p>
          </div>
        } @else {
          <app-menu-list
            [menus]="menus()"
            (onEdit)="handleEdit($event)"
            (onDelete)="handleDelete($event)"
            (onReorder)="handleReorder($event)"
            (onSubmenuClick)="openSubmenuModal($event)">
          </app-menu-list>
        }
      </div>

      <!-- Formulário (Direita - Menu Lateral) -->
      <div class="menu-form-section">
        <app-menu-form
          [menuToEdit]="state().menuToEdit"
          [existingMenus]="menus()"
          (onSave)="handleSave($event)"
          (onCancel)="handleCancel()">
        </app-menu-form>
      </div>
    </div>
  </div>
</div>

<!-- Modal para Gerenciar Submenu -->
<modal 
  [(isOpen)]="isSubmenuModalOpen"
  (closed)="closeSubmenuModal()">
  <div class="submenu-modal-content">
    <div class="submenu-modal-header">
      <h2>Gerenciar Submenu: {{ selectedSubmenu()?.name }}</h2>
      <p class="submenu-info">
        <span class="material-icons">info</span>
        Adicione itens de menu a este submenu.
      </p>
    </div>
    
    <div class="submenu-form-wrapper">
      <app-submenu-form
        [parentMenu]="selectedSubmenu()!"
        [existingMenus]="selectedSubmenu()?.children || []"
        [allMenus]="menus()"
        (onSave)="handleSubmenuSave()"
        (onCancel)="closeSubmenuModal()">
      </app-submenu-form>
    </div>
  </div>
</modal>
