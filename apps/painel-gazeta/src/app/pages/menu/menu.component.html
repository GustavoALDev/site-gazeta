<div class="menu-container">
  <div class="menu-card">
    <!-- Header com título -->
    <div class="page-header">
      <h1 class="page-title">Gerenciamento de Menu</h1>
      <p class="page-subtitle">Crie e organize os itens do menu de navegação do site</p>
    </div>

    <!-- Menu de abas -->
    <div class="tabs-container">
      <div class="tabs-header">
        <button 
          class="tab-button" 
          [class.active]="state().activeTab === 'form'"
          (click)="setActiveTab('form')">
          <i class="material-icons">{{ isEdit() ? 'edit' : 'add' }}</i>
          {{ isEdit() ? 'Editar Menu' : 'Criar Menu' }}
        </button>
        <button 
          class="tab-button" 
          [class.active]="state().activeTab === 'list'"
          (click)="setActiveTab('list')">
          <i class="material-icons">list</i>
          Lista de Menus
        </button>
      </div>

      <div class="tab-content">
        <!-- Aba do Formulário -->
        @if (state().activeTab === 'form') {
          <div class="tab-pane active">
            <app-menu-form
              [menuToEdit]="state().menuToEdit"
              [existingMenus]="menus()"
              (onSave)="handleSave($event)"
              (onCancel)="handleCancel()">
            </app-menu-form>
          </div>
        }

        <!-- Aba da Lista -->
        @if (state().activeTab === 'list') {
          <div class="tab-pane active">
            @if (isLoading()) {
              <div class="loading-state">
                <span class="material-icons spinning">refresh</span>
                <p>Carregando menus...</p>
              </div>
            } @else {
              <app-menu-list
                [menus]="menus()"
                (onEdit)="handleEdit($event)"
                (onDelete)="handleDelete($event)"
                (onReorder)="handleReorder($event)">
              </app-menu-list>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
