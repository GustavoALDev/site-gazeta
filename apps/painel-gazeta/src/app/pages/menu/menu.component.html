<div class="menu-container">
  <div class="menu-card">
    
    <!-- Header -->
    <div class="menu-header">
      <h2>Gerenciamento de Menu</h2>
      <p>Crie e organize os itens do menu de navegação do site</p>
    </div>

    <!-- Content Wrapper -->
    <div class="menu-content-wrapper">
      
      <!-- Form Section -->
      <div class="menu-form-section" [class.collapsed]="!showForm()">
        <div class="section-header">
          <h3>
            <span class="material-icons">{{ menuToEdit() ? 'edit' : 'add_circle' }}</span>
            {{ menuToEdit() ? 'Editar Menu' : 'Novo Menu' }}
          </h3>
          <button 
            type="button" 
            class="toggle-btn" 
            (click)="toggleForm()"
            [title]="showForm() ? 'Ocultar formulário' : 'Mostrar formulário'"
          >
            <span class="material-icons">{{ showForm() ? 'expand_less' : 'expand_more' }}</span>
          </button>
        </div>
        
        @if (showForm()) {
          <div class="form-content">
            <app-menu-form
              [menuToEdit]="menuToEdit()"
              [existingMenus]="menus()"
              (onSave)="handleSave($event)"
              (onCancel)="handleCancel()"
            />
          </div>
        }
      </div>

      <!-- List Section -->
      <div class="menu-list-section">
        @if (isLoading()) {
          <div class="loading-state">
            <span class="material-icons spinning">refresh</span>
            <p>Carregando menus...</p>
          </div>
        } @else {
          <app-menu-list
            [menus]="menus()"
            (onEdit)="handleEdit($event)"
            (onDelete)="handleDelete($event)"
            (onReorder)="handleReorder($event)"
          />
        }
      </div>

    </div>
  </div>
</div>
