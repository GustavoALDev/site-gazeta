<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <img src="img/logo02.webp" alt="logo">
      </div>
      <span class="divider"></span>
      <h2>Painel de controle</h2>
      <p>Faça login para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Seu e-mail"
          required>
          <span class="error">{{ displayError()!['email'] }}</span>
          <span>{{loginForm.get('email')?.hasError('required')}}</span>
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Sua senha"
          required>
          <span class="error">{{ displayError()!['password'] }}</span>
      </div>

      <div class="form-actions">
        <span class="error">{{ displayError()!['server'] }}</span>
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Lembrar-me</label>
        </div>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="login-button">Entrar</button>
    </form>
  </div>
</div>
