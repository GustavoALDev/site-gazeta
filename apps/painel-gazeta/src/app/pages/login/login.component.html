<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <img src="img/logo02.webp" alt="logo">
      </div>
      <span class="divider"></span>
      <h2>Painel de controle</h2>
      <p>Faça login para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="Seu e-mail" required>
        <error-message [errorMessage]="displayError()!['email']"></error-message>
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <div class="password-input-container">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            autocomplete="off"
            id="password" 
            formControlName="password"
            placeholder="Sua senha" required>
          <span class="material-symbols-outlined password-toggle" 
                (click)="showPassword.set(!showPassword())" 
                tabindex="0" 
                role="button"
                (keyup.enter)="showPassword.set(!showPassword())">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </span>
        </div>
        <error-message [errorMessage]="displayError()!['password']"></error-message>
      </div>
      <error-message [textAlign]="'center'" [errorMessage]="displayError()!['server']"></error-message>
      
      <div class="form-actions">
        <div class="remember-me">
          <input type="checkbox" id="remember" (change)="remember.set(!remember())"> 
          <label for="remember">Lembrar-me</label>
        </div>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="login-button" [disabled]="loginForm.invalid">Entrar</button>
    </form>
  </div>
</div>
