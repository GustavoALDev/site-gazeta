<div class="main-container">
  <div
    class="editor-container editor-container_classic-editor editor-container_include-outline editor-container_include-fullscreen"
    #editorContainerElement
  >
    <div class="editor-container__editor-wrapper">
      <div class="editor-container__sidebar" #editorOutlineElement></div>
      <div class="editor-container__editor">
        <div #editorElement>
          @if (isLayoutReady) {
            <ckeditor [editor]="Editor" [config]="config" />
          }
        </div>
      </div>
    </div>
  </div>
</div>
