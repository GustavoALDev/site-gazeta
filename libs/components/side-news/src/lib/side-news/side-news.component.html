@if (newsList().length > 0) {
<article class="side-news">
    <div class="header">
        <h2 >{{title()}}</h2>
    </div>
    <div class="news-list">
        @for (news of newsList(); track news.id; let index = $index) {
        <div class="news-item"  [routerLink]="['/news', news.slug]">
            <div class="news-index" >{{index + 1}}</div>
            <div class="news-content">
                <h3 class="news-title" [style.color]="category()?.color" >{{news.title}}</h3>
            </div>
        </div>
        }
    </div>
</article>
}
