<div class="related-news-container">
  <h3 class="section-title">Notícias Relacionadas</h3>
  
  <div class="cards-container">
    @for (news of (relatedNews()|async); track news.id; let i = $index) {

        <article class="news-card" [routerLink]="['/news', news.slug]">
          <div class="card-image">
            @if (news.mediaNews && news.mediaNews.length > 0) {
              <img 
                [ngSrc]="news.mediaNews[0].imgSize!.small" 
                [alt]="news.title"
                fill
                loading="lazy"
              />
            } @else {
              <div class="placeholder-image">
                <span>Sem imagem</span>
              </div>
            }
          </div>
          
          <div class="card-content">
            <h4 class="news-title">{{ news.title }}</h4>
            @if (news.subtitle) {
              <p class="news-subtitle">{{ news.subtitle }}</p>
            }
          </div>
        </article>
      }
  </div>
</div>
