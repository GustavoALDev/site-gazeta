@if(newslist() && newslist().length > 0) {
<div class="category-horizontal-container">
  <div class="category-header">
    <h2>{{ safeCategory().name }}</h2>
    <div class="category-underline" [style.background]="safeCategory().color"></div>
  </div>
  <div class="news-cards-row">
    @for (news of newslist().slice(0, 3); track news.id) {
      <div class="news-card" [routerLink]="['/news', news.slug]">
        <div class="news-card__image-container">
          <img 
            [ngSrc]="news.mediaNews[0].imgSize!.medium!" 
            [alt]="news.title" 
            class="news-card__image"
            fill
            loading="lazy"
            (error)="onImageError($event)" 
          />
        </div>
        <div class="news-title">{{ news.title }}</div>
      </div>
    }
    @if(announcements()) {
    <div class="ads-container">
      <span>Conteúdo Publicitário</span>
      <lib-ads [size]="adSize()" [announcements]="announcements()"></lib-ads>
    </div>
    }
  </div>
</div>
}
