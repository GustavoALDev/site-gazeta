<section class="top-gazeta">

  <div class="top-gazeta__grid">
    @for (data of $news(); track data) {
      <div class="top-gazeta__category" [attr.data-category]="data.category.color">
        <h3 class="category__title">{{ data.category.name }}</h3>
        <ul class="category__list">
          @for (newsItem of data.news; track newsItem.id; let index = $index) {
            <li class="category__item">
              <span class="item__number">{{ index + 1 }}</span>
              <a [routerLink]="['/news', newsItem.slug]" class="item__link">
                <p class="item__text">{{ newsItem.title }}</p>
              </a>
            </li>

          } @empty {
            <li class="category__empty">Nenhuma notícia disponível</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
