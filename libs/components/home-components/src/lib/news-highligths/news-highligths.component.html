<section class="top-gazeta">
  <div class="top-gazeta__header">
    <h2 class="top-gazeta__title">TOP GAZETA</h2>
  </div>

  <div class="top-gazeta__grid">
    @for (newsItem of findNewsByCategory().slice(0, 3); track newsItem.id) {
      <div class="top-gazeta__category" [attr.data-category]="newsItem.color">
        <h3 class="category__title">{{ newsItem.name }}</h3>
        <ul class="category__list">
          @for (newsItem of newsItem.news; track newsItem.id; let index = $index) {
            <li class="category__item">
              <span class="item__number">{{ index + 1 }}</span>
              <a [routerLink]="['/news', newsItem.slug]" class="item__link">
                <p class="item__text">{{ newsItem.title }}</p>
              </a>
            </li>
           
          } @empty {
            <li class="category__empty">Nenhuma notícia disponível</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
